# Servidor (8081 para no chocar con citas-medicas en 8080)
server.port=8081

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/farma_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jackson.serialization.write-dates-as-timestamps=false

# JWT - clave Base64 de 256 bits, cambiala en produccion
jwt.secret=ZmFybWEtcHJlZGljdC1mYXJtYS1wcmVkaWN0LWp3dC1zZWNyZXQtMDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
jwt.expiration-ms=86400000
